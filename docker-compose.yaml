version: '3.9'

services:
  agent-perpetual:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: agent-perpetual-app
    ports:
      - "8000:8000"  # FastAPI
      - "8001:8001"  # Prometheus Metrics
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/agent_system.db
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production
    volumes:
      - agent-data:/app/data
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - agent-network

  redis:
    image: redis:7-alpine
    container_name: agent-perpetual-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - agent-network

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: agent-perpetual-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - agent-network
    depends_on:
      - agent-perpetual

  grafana:
    image: grafana/grafana:10.2.2
    container_name: agent-perpetual-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    networks:
      - agent-network
    depends_on:
      - prometheus

volumes:
  agent-data:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  agent-network:
    driver: bridge
    name: agent-perpetual-network
