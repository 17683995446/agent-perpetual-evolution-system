global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'agent-perpetual'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'agent-perpetual-api'
    static_configs:
      - targets: ['agent-perpetual:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'agent-perpetual-system'
    static_configs:
      - targets: ['agent-perpetual:8001']
    scrape_interval: 5s

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
